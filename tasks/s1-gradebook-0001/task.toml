# Harbor-compatible task definition - s1-gradebook-0001 (revyl-bench season 1). Layout: docs/tasks.md

schema_version = "1.1"
artifacts = ["/logs/verifier", "/app/.git"]

[task]
name = "revyl/s1-gradebook-0001"
version = "1.0.0"
description = "Build a mobile gradebook app (Expo/TypeScript, iOS) from a blank scaffold in three verified steps: tab shell + roster + seed scores, per-student grades derived through three layers (category averages over recorded scores, a 20/30/50 weighted overall of the ROUNDED averages, letter grades with on-boundary cases) plus a score-entry flow, then a class view with per-assessment averages, a hardest-assessment tie rule and a two-level ranking tie-break. Every submission is graded against the FULL frozen suite (three step tests + final e2e) by Revyl device tests on a cloud iOS simulator with screenshot validations."
keywords = ["mobile", "expo", "react-native", "typescript", "device-verified", "multi-step", "greenfield", "benchmark"]
multi_step_reward_strategy = "final"

[[task.authors]]
name = "Revyl"

[metadata]
sample_id = "s1-gradebook-0001"
archetype = "gradebook"
language = "typescript"
platform = "ios"
source_status = "synthetic_permission_clean"
category = ["feature-implementation", "root-cause-analysis", "code-onboarding"]
task_version = 1
verifier = "revyl-frozen-device-tests"
verifier_stability = "every frozen test returned the same verdict on repeated device runs against a reference build; the run records are held by Revyl"
frozen_test_names = ["s1gb-t_1-tabs", "s1gb-t_2-students-entry", "s1gb-t_3-class-settings", "s1gb-final-e2e"]
grading = "full-suite-per-submission"

[environment]
build_timeout_sec = 1200.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "allowlist"
env = { REVYL_API_KEY = "${REVYL_API_KEY}" }   # agent-org key only; builds run in the runner

[agent]
timeout_sec = 28800.0
network_mode = "allowlist"
allowed_hosts = ["*.revyl.ai", "*.revyl.com", "*.expo.dev", "*.exp.host", "*.eas.build", "registry.npmjs.org", "*.npmjs.org", "api.github.com", "github.com"]

[verifier]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["*.revyl.ai", "*.revyl.com"]

[[steps]]
name = "01-tabs"
min_reward = 1.0

[[steps]]
name = "02-students-entry"
min_reward = 1.0

[[steps]]
name = "03-class-settings"
min_reward = 1.0

# --- revyl-bench-runtime provisioning (auto-written) ---
# Ids minted by provisioning (docs/organizations.md): the grading app and suite workflow
# in the grading organisation, the dev app and dev-client pin in the agent organisation.
# NOT secret — only the keys are. The organisations themselves are named by the launch
# environment (REVYL_GRADING_ORG_ID / REVYL_AGENT_ORG_ID in runtime/.env), not here.
[runtime.agent]
scaffold = "scaffolds/s1-gradebook-0001"
base_commit = "a5bdd8954bd89aca31fa2a3dd7006fecf094a3aa"
expo_sdk = 57
ios_scheme = "benchs1gradebook0001"
# --- end runtime provisioning ---
