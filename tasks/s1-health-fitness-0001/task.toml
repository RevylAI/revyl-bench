# Harbor-compatible task definition - s1-health-fitness-0001 (revyl-bench season 1). Layout: docs/tasks.md

schema_version = "1.1"
artifacts = ["/logs/verifier", "/app/.git"]

[task]
name = "revyl/s1-health-fitness-0001"
version = "1.1.0"
description = "Build a mobile health & fitness tracker (Expo/TypeScript, iOS) from a blank scaffold in three verified steps: tab shell + seed data, exercise log + date-grouped history, progress aggregation + persistent daily goal. Each step is graded by a frozen Revyl device test running the app on a cloud iOS simulator with screenshot validations; the final e2e test provides end-to-end acceptance."
keywords = ["mobile", "expo", "react-native", "typescript", "device-verified", "multi-step", "greenfield"]
multi_step_reward_strategy = "final"

[[task.authors]]
name = "Revyl"

[metadata]
sample_id = "s1-health-fitness-0001"
archetype = "health_fitness"
language = "typescript"
platform = "ios"
source_status = "synthetic_permission_clean"
category = ["feature-implementation", "root-cause-analysis", "code-onboarding"]
task_version = 3
verifier = "revyl-frozen-device-tests"
verifier_stability = "every frozen test returned the same verdict on repeated device runs against a reference build; the run records are held by Revyl"
frozen_test_names = ["s1hf-t_1-tabs", "s1hf-t_2-log-history", "s1hf-t_3-progress-goal", "s1hf-final-e2e"]
grading = "full-suite-per-submission"

[environment]
build_timeout_sec = 1200.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "allowlist"
env = { REVYL_API_KEY = "${REVYL_API_KEY}" }   # agent-org key only; builds run in the runner

[agent]
timeout_sec = 28800.0
network_mode = "allowlist"
allowed_hosts = ["*.revyl.ai", "*.revyl.com", "*.expo.dev", "*.exp.host", "*.eas.build", "registry.npmjs.org", "*.npmjs.org", "api.github.com", "github.com"]

[verifier]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["*.revyl.ai", "*.revyl.com"]

[[steps]]
name = "01-tabs"
min_reward = 1.0

[[steps]]
name = "02-log-history"
min_reward = 1.0

[[steps]]
name = "03-progress-goal"
min_reward = 1.0

# --- revyl-bench-runtime provisioning (auto-written) ---
# Ids minted by provisioning (docs/organizations.md): the grading app and suite workflow
# in the grading organisation, the dev app and dev-client pin in the agent organisation.
# NOT secret — only the keys are. The organisations themselves are named by the launch
# environment (REVYL_GRADING_ORG_ID / REVYL_AGENT_ORG_ID in runtime/.env), not here.
[runtime.agent]
scaffold = "scaffolds/s1-health-fitness-0001"
base_commit = "3fec69bdd9fbde0fe8f0ad7a9ef4c75845cddfa8"
expo_sdk = 57
ios_scheme = "benchs1healthfitness0001"
# --- end runtime provisioning ---
