# Harbor-compatible task definition - s1-till-0001 (revyl-bench season 1). Layout: docs/tasks.md

schema_version = "1.1"
artifacts = ["/logs/verifier", "/app/.git"]

[task]
name = "revyl/s1-till-0001"
version = "1.0.0"
description = "Build a mobile cash-register app (Expo/TypeScript, iOS) from a blank scaffold in three verified steps: tab shell + seeded catalog + opening drawer, a sale flow tendering cash with change composed by a pinned greedy-denomination rule (no-nickel drawer), then refunds with reason codes, a till reconciliation deriving expected cash from the transaction ledger, and a Z-report summary. DISTINGUISHING MECHANIC: a contract-mandated audit log — every audited action emits exactly one pinned console.log line, which the contract tells the agent is graded from the device's captured os_log (in season 1 the log channel was not provisioned, so only the screenshot validations were scored). Every submission is graded against the FULL frozen suite (three step tests + final e2e) on a cloud iOS simulator."
keywords = ["mobile", "expo", "react-native", "typescript", "device-verified", "multi-step", "greenfield", "benchmark", "audit-log"]
multi_step_reward_strategy = "final"

[[task.authors]]
name = "Revyl"

[metadata]
sample_id = "s1-till-0001"
archetype = "till"
language = "typescript"
platform = "ios"
source_status = "synthetic_permission_clean"
category = ["feature-implementation", "root-cause-analysis", "code-onboarding"]
task_version = 1
verifier = "revyl-frozen-device-tests"
verifier_stability = "every frozen test returned the same verdict on repeated device runs against a reference build; the run records are held by Revyl"
frozen_test_names = ["s1tl-t_1-tabs-catalog", "s1tl-t_2-sale-tender", "s1tl-t_3-refunds-zreport", "s1tl-final-e2e"]
grading = "full-suite-per-submission"

[environment]
build_timeout_sec = 1200.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 20480
network_mode = "allowlist"
env = { REVYL_API_KEY = "${REVYL_API_KEY}" }   # agent-org key only; builds run in the runner

[agent]
timeout_sec = 28800.0
network_mode = "allowlist"
allowed_hosts = ["*.revyl.ai", "*.revyl.com", "*.expo.dev", "*.exp.host", "*.eas.build", "registry.npmjs.org", "*.npmjs.org", "api.github.com", "github.com"]

[verifier]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["*.revyl.ai", "*.revyl.com"]

[[steps]]
name = "01-tabs-catalog"
min_reward = 1.0

[[steps]]
name = "02-sale-tender"
min_reward = 1.0

[[steps]]
name = "03-refunds-zreport"
min_reward = 1.0

# --- revyl-bench-runtime provisioning (auto-written) ---
# Ids minted by provisioning (docs/organizations.md): the grading app and suite workflow
# in the grading organisation, the dev app and dev-client pin in the agent organisation.
# NOT secret — only the keys are. The organisations themselves are named by the launch
# environment (REVYL_GRADING_ORG_ID / REVYL_AGENT_ORG_ID in runtime/.env), not here.
[runtime.agent]
scaffold = "scaffolds/s1-till-0001"
base_commit = "6a96a6ef82369503961712f65cb72fe491ad9922"
expo_sdk = 57
ios_scheme = "benchs1till0001"
# --- end runtime provisioning ---
