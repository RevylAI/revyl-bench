# Device-test suite for s1-personal-finance-0001. Withheld from the agent at run time; loaded into your own
# grading organisation by runtime/provision/provision_grading.py (see grading-side/README.md).
test:
    metadata:
        name: s1pf-t_1-tabs
        platform: ios
    build:
        name: bench-s1-personal-finance-0001
    blocks:
        - type: manual
          step_type: wait
          step_description: "2"
        - type: validation
          step_description: The app has launched without a red screen or runtime error dialog, and a bottom tab bar shows Accounts, Budget, and Insights tabs.
        - type: instructions
          step_description: Tap the 'Budget' tab in the bottom tab bar.
        - type: validation
          step_description: The Budget tab is selected and the screen shows the heading 'Budget' without any crash or error.
        - type: instructions
          step_description: Tap the 'Insights' tab in the bottom tab bar.
        - type: validation
          step_description: The Insights tab is selected and the screen shows the heading 'Insights' without any crash or error.
        - type: instructions
          step_description: Tap the 'Accounts' tab in the bottom tab bar.
        - type: validation
          step_description: The Accounts tab is selected and the screen shows the heading 'Accounts' without any crash or error.
