# Device-test suite for s1-bookings-0001. Withheld from the agent at run time; loaded into your own
# grading organisation by runtime/provision/provision_grading.py (see grading-side/README.md).
test:
    metadata:
        name: s1bk-t_1-tabs
        platform: ios
    build:
        name: bench-s1-bookings-0001
    blocks:
        - type: manual
          step_type: wait
          step_description: "2"
        - type: validation
          step_description: The app has launched without a red screen or runtime error dialog, and a bottom tab bar shows Rooms, Bookings, and Settings tabs.
        - type: instructions
          step_description: Tap the 'Bookings' tab in the bottom tab bar.
        - type: validation
          step_description: The Bookings tab is selected and the screen shows the heading 'Bookings' without any crash or error.
        - type: instructions
          step_description: Tap the 'Settings' tab in the bottom tab bar.
        - type: validation
          step_description: The Settings tab is selected and the screen shows the heading 'Settings' without any crash or error.
        - type: instructions
          step_description: Tap the 'Rooms' tab in the bottom tab bar.
        - type: validation
          step_description: The Rooms tab is selected and the screen shows the heading 'Rooms' without any crash or error.
