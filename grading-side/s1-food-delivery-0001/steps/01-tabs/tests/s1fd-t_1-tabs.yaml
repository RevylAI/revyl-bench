# Device-test suite for s1-food-delivery-0001. Withheld from the agent at run time; loaded into your own
# grading organisation by runtime/provision/provision_grading.py (see grading-side/README.md).
test:
    metadata:
        name: s1fd-t_1-tabs
        platform: ios
    build:
        name: bench-s1-food-delivery-0001
    blocks:
        - type: manual
          step_type: wait
          step_description: "2"
        - type: validation
          step_description: The app has launched without a red screen or runtime error dialog, and a bottom tab bar shows Restaurants, Cart, and Checkout tabs.
        - type: instructions
          step_description: Tap the 'Cart' tab in the bottom tab bar.
        - type: validation
          step_description: The Cart tab is selected and the screen shows the heading 'Cart' without any crash or error.
        - type: instructions
          step_description: Tap the 'Checkout' tab in the bottom tab bar.
        - type: validation
          step_description: The Checkout tab is selected and the screen shows the heading 'Checkout' without any crash or error.
        - type: instructions
          step_description: Tap the 'Restaurants' tab in the bottom tab bar.
        - type: validation
          step_description: The Restaurants tab is selected and the screen shows the heading 'Restaurants' without any crash or error.
