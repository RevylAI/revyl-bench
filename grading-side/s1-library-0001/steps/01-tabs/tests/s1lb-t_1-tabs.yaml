# Device-test suite for s1-library-0001. Withheld from the agent at run time; loaded into your own
# grading organisation by runtime/provision/provision_grading.py (see grading-side/README.md).
test:
    metadata:
        name: s1lb-t_1-tabs
        platform: ios
    build:
        name: bench-s1-library-0001
    blocks:
        - type: manual
          step_type: wait
          step_description: "2"
        - type: validation
          step_description: "The app has launched without a red screen or runtime error dialog; the bottom tab bar shows Catalog, Members, Loans, Desk and Settings, and the Catalog tab lists 'The Glass Harbor' with '1 of 3 available' and 'Winter Arithmetic' with '0 of 2 available'."
        - type: instructions
          step_description: Tap the 'Members' tab in the bottom tab bar.
        - type: validation
          step_description: The Members tab is selected and the screen shows the heading 'Members' with five member rows including 'Maya Chen' and 'Elif Kaya', without any crash or error.
        - type: instructions
          step_description: Tap the 'Loans' tab in the bottom tab bar.
        - type: validation
          step_description: The Loans tab is selected and the screen shows the heading 'Loans' with a section headed 'Out (9)' and a section headed 'Returned (8)', without any crash or error.
        - type: instructions
          step_description: Tap the 'Desk' tab in the bottom tab bar.
        - type: validation
          step_description: The Desk tab is selected and the screen shows the heading 'Desk' without any crash or error.
        - type: instructions
          step_description: Tap the 'Settings' tab in the bottom tab bar.
        - type: validation
          step_description: The Settings tab is selected and the screen shows the heading 'Settings' without any crash or error.
