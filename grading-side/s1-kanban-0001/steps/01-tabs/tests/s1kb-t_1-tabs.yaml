# Device-test suite for s1-kanban-0001. Withheld from the agent at run time; loaded into your own
# grading organisation by runtime/provision/provision_grading.py (see grading-side/README.md).
test:
    metadata:
        name: s1kb-t_1-tabs
        platform: ios
    build:
        name: bench-s1-kanban-0001
    blocks:
        - type: manual
          step_type: wait
          step_description: "2"
        - type: validation
          step_description: The app has launched without a red screen or runtime error dialog, and a bottom tab bar shows Board, My Work, and Settings tabs.
        - type: instructions
          step_description: Tap the 'My Work' tab in the bottom tab bar.
        - type: validation
          step_description: The My Work tab is selected and the screen shows the heading 'My Work' without any crash or error.
        - type: instructions
          step_description: Tap the 'Settings' tab in the bottom tab bar.
        - type: validation
          step_description: The Settings tab is selected and the screen shows the heading 'Settings' without any crash or error.
        - type: instructions
          step_description: Tap the 'Board' tab in the bottom tab bar.
        - type: validation
          step_description: The Board tab is selected and the screen shows the heading 'Board' without any crash or error.
