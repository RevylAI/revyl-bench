# Device-test suite for s1-recipes-0001. Withheld from the agent at run time; loaded into your own
# grading organisation by runtime/provision/provision_grading.py (see grading-side/README.md).
test:
    metadata:
        name: s1rs-t_1-tabs
        platform: ios
    build:
        name: bench-s1-recipes-0001
    blocks:
        - type: manual
          step_type: wait
          step_description: "2"
        - type: validation
          step_description: The app has launched without a red screen or runtime error dialog, and a bottom tab bar shows Recipes, List, and Settings tabs.
        - type: instructions
          step_description: Tap the 'List' tab in the bottom tab bar.
        - type: validation
          step_description: The List tab is selected and the screen shows the heading 'List' without any crash or error.
        - type: instructions
          step_description: Tap the 'Settings' tab in the bottom tab bar.
        - type: validation
          step_description: The Settings tab is selected and the screen shows the heading 'Settings' without any crash or error.
        - type: instructions
          step_description: Tap the 'Recipes' tab in the bottom tab bar.
        - type: validation
          step_description: The Recipes tab is selected and the screen shows the heading 'Recipes' without any crash or error.
