# Device-test suite for s1-scheduler-0001. Withheld from the agent at run time; loaded into your own
# grading organisation by runtime/provision/provision_grading.py (see grading-side/README.md).
test:
    metadata:
        name: s1sc-t_1-tabs-rooms
        platform: ios
    build:
        name: bench-s1-scheduler-0001
    blocks:
        - type: manual
          step_type: wait
          step_description: "2"
        - type: validation
          step_description: The app has launched without a red screen or runtime error dialog, and a bottom tab bar shows Rooms, Book, and Settings tabs.
        - type: validation
          step_description: "The Rooms tab lists five rooms named 'Aurora', 'Boardroom', 'Fern', 'Huddle' and 'Lumen' showing 'Seats 12', 'Seats 20', 'Seats 6', 'Seats 4' and 'Seats 8' respectively, with the 'Boardroom' row showing 'Screen, VC, Whiteboard'."
        - type: instructions
          step_description: Tap the 'Aurora' room row.
        - type: validation
          step_description: "A room detail screen is shown for 'Aurora' with 'Seats 12' and a Schedule section listing '08:30-09:45 Design Review (8)', '11:00-12:30 Sprint Planning (10)' and '14:15-15:05 Client Call (3)' in that order."
        - type: instructions
          step_description: Tap the back button at the top-left to return to the room list.
        - type: instructions
          step_description: Tap the 'Book' tab in the bottom tab bar.
        - type: validation
          step_description: The Book tab is selected and the screen shows the heading 'Book' without any crash or error.
        - type: instructions
          step_description: Tap the 'Settings' tab in the bottom tab bar.
        - type: validation
          step_description: The Settings tab is selected and the screen shows the heading 'Settings' without any crash or error.
