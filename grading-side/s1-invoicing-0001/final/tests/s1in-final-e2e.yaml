# Device-test suite for s1-invoicing-0001. Withheld from the agent at run time; loaded into your own
# grading organisation by runtime/provision/provision_grading.py (see grading-side/README.md).
test:
    metadata:
        name: s1in-final-e2e
        platform: ios
        tags:
            - e2e
    build:
        name: bench-s1-invoicing-0001
    blocks:
        - type: manual
          step_type: wait
          step_description: "2"
        - type: validation
          step_description: "The Clients list shows 'Lumen Analytics' reading 'Outstanding $3,480.92' and '1 overdue', and 'Solstice Cafe' reading 'Outstanding $1,179.24' and '1 overdue'."
        - type: instructions
          step_description: Tap the 'Invoices' tab in the bottom tab bar.
        - type: validation
          step_description: "The Invoices tab item in the bottom tab bar shows a numeric badge reading 5, and the list begins with 'INV-1001' reading 'Overdue' and $1,830.60."
        - type: instructions
          step_description: Scroll down the invoice list until the last invoice is visible.
        - type: validation
          step_description: "The bottom of the list shows 'INV-1014' reading 'Sent' and $930.37."
        - type: instructions
          step_description: Tap 'Overdue' in the filter row at the top.
        - type: validation
          step_description: "The list shows exactly five invoices, 'INV-1001', 'INV-1002', 'INV-1004', 'INV-1005' and 'INV-1006', and no row for 'INV-1003'."
        - type: instructions
          step_description: Tap the 'INV-1004' row.
        - type: instructions
          step_description: Scroll down the invoice screen until the totals are visible.
        - type: validation
          step_description: "The invoice screen titled 'INV-1004' reads 'Subtotal $3,030.60', 'Discount (15%) $454.60', 'Tax $198.93', 'Total $2,774.93' and 'Balance due $2,774.93'."
        - type: instructions
          step_description: Tap the back button at the top-left to return to the invoice list.
        - type: instructions
          step_description: Tap 'All' in the filter row at the top.
        - type: instructions
          step_description: Scroll the invoice list until the 'INV-1009' row is visible.
        - type: instructions
          step_description: Tap the 'INV-1009' row.
        - type: instructions
          step_description: Scroll down the invoice screen until the totals are visible.
        - type: validation
          step_description: "The invoice screen titled 'INV-1009' reads 'Partial', 'Paid $500.00' and 'Balance due $705.99'."
        - type: instructions
          step_description: "Tap the amount input at the bottom (the input showing the hint text '0.00') and type: 300.00"
        - type: instructions
          step_description: Tap the 'Record payment' button.
        - type: validation
          step_description: "Without any further scrolling, the screen reads 'Paid $800.00' and 'Balance due $405.99', and the status still reads 'Partial'."
        - type: instructions
          step_description: Tap the back button at the top-left to return to the invoice list.
        - type: instructions
          step_description: Scroll the invoice list until the 'INV-1005' row is visible.
        - type: instructions
          step_description: Tap the 'INV-1005' row.
        - type: instructions
          step_description: "Tap the amount input at the bottom (the input showing the hint text '0.00') and type: 600.00"
        - type: instructions
          step_description: Tap the 'Record payment' button.
        - type: validation
          step_description: "Without any further scrolling, the screen reads 'Paid $1,000.00' and 'Credit $74.10', and the status reads 'Paid'."
        - type: instructions
          step_description: Tap the back button at the top-left to return to the invoice list.
        - type: validation
          step_description: "The Invoices tab item in the bottom tab bar shows a numeric badge reading 4."
        - type: instructions
          step_description: Tap the 'Clients' tab in the bottom tab bar.
        - type: validation
          step_description: "'Solstice Cafe' now reads 'Outstanding $653.34' and '0 overdue', and 'Lumen Analytics' reads 'Outstanding $3,180.92' and '1 overdue'."
        - type: instructions
          step_description: Tap the 'Settings' tab in the bottom tab bar.
        - type: validation
          step_description: "The Settings tab shows 'Total outstanding: $9,839.52', 'Total collected: $7,513.35' and 'Overdue invoices: 4'."
