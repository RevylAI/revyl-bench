# Device-test suite for s1-invoicing-0001. Withheld from the agent at run time; loaded into your own
# grading organisation by runtime/provision/provision_grading.py (see grading-side/README.md).
test:
    metadata:
        name: s1in-t_1-tabs
        platform: ios
    build:
        name: bench-s1-invoicing-0001
    blocks:
        - type: manual
          step_type: wait
          step_description: "2"
        - type: validation
          step_description: The app has launched without a red screen or runtime error dialog, and a bottom tab bar shows Clients, Invoices, and Settings tabs.
        - type: instructions
          step_description: Tap the 'Invoices' tab in the bottom tab bar.
        - type: validation
          step_description: The Invoices tab is selected and the screen shows the heading 'Invoices' without any crash or error.
        - type: instructions
          step_description: Tap the 'Settings' tab in the bottom tab bar.
        - type: validation
          step_description: The Settings tab is selected and the screen shows the heading 'Settings' without any crash or error.
        - type: instructions
          step_description: Tap the 'Clients' tab in the bottom tab bar.
        - type: validation
          step_description: The Clients tab is selected and the screen shows the heading 'Clients' without any crash or error.
